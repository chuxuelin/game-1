<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .menu-container, .game-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(100, 255, 100, 0.5);
        }

        .menu-section {
            margin-bottom: 30px;
        }

        .menu-section h2 {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .mode-btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 150px;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #000;
            border-color: #4ade80;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
        }

        .mode-btn:hover {
            transform: translateY(-2px);
        }

        .level-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .level-btn {
            width: 50px;
            height: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .level-btn.active {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.4);
        }

        .level-btn.locked {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .level-btn:hover:not(.locked) {
            transform: scale(1.1);
        }

        .skin-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .skin-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .skin-btn.active {
            border-color: #fff;
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .skin-btn:hover {
            transform: scale(1.1);
        }

        .skin-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 25px;
            height: 25px;
            transform: translate(-50%, -50%);
            border-radius: 5px;
        }

        .skin-btn.green::before { background: linear-gradient(135deg, #86efac, #22c55e); }
        .skin-btn.blue::before { background: linear-gradient(135deg, #93c5fd, #3b82f6); }
        .skin-btn.red::before { background: linear-gradient(135deg, #fca5a5, #ef4444); }
        .skin-btn.purple::before { background: linear-gradient(135deg, #d8b4fe, #8b5cf6); }
        .skin-btn.gold::before { background: linear-gradient(135deg, #fde68a, #f59e0b); }
        .skin-btn.cyan::before { background: linear-gradient(135deg, #67e8f9, #06b6d4); }
        .skin-btn.pink::before { background: linear-gradient(135deg, #f9a8d4, #ec4899); }
        .skin-btn.rainbow::before { 
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            animation: rainbow 2s linear infinite;
        }

        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .skin-preview {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .preview-segment {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }

        .start-game-btn {
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: #fff;
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 300px;
        }

        .start-game-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(167, 139, 250, 0.4);
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .score-item {
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .score-item span {
            color: #4ade80;
        }

        .level-info {
            text-align: center;
            color: #60a5fa;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(100, 255, 100, 0.2);
            background: #000;
            max-width: 100%;
            height: auto;
        }

        .controls {
            margin-top: 20px;
            text-align: center;
        }

        .game-btn {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 0 8px;
            transition: all 0.3s ease;
        }

        #start-btn {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #000;
        }

        #pause-btn {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
        }

        #leaderboard-btn {
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: #fff;
        }

        #back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .instructions {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            font-size: 0.85rem;
        }

        .game-over, .level-complete, .leaderboard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .game-over.show, .level-complete.show, .leaderboard.show {
            display: flex;
        }

        .game-over h2 {
            color: #ef4444;
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        .level-complete h2 {
            color: #4ade80;
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }

        .leaderboard h2 {
            color: #a78bfa;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
        }

        .game-over p, .level-complete p {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 25px;
        }

        #final-score, #level-score {
            color: #4ade80;
            font-size: 1.5rem;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: #fff;
            padding: 12px 40px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 40px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-2px);
        }

        .leaderboard-table {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .leaderboard-row {
            display: flex;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .leaderboard-row:last-child {
            border-bottom: none;
        }

        .leaderboard-row.header {
            background: rgba(167, 139, 250, 0.3);
            font-weight: bold;
        }

        .leaderboard-row.top-three:nth-child(2) { background: rgba(251, 191, 36, 0.2); }
        .leaderboard-row.top-three:nth-child(3) { background: rgba(192, 192, 192, 0.2); }
        .leaderboard-row.top-three:nth-child(4) { background: rgba(217, 119, 6, 0.2); }

        .rank { width: 40px; color: #fff; }
        .name { flex: 1; color: #fff; }
        .score { width: 80px; color: #4ade80; text-align: right; }

        .empty-leaderboard {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .name-input {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .name-input-content {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .name-input h2 {
            color: #4ade80;
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }

        .name-input p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        #player-name-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.2rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        #player-name-input:focus {
            border-color: #4ade80;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
        }

        #player-name-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .name-hint {
            font-size: 0.85rem !important;
            color: rgba(255, 255, 255, 0.5) !important;
            margin-top: 15px !important;
            margin-bottom: 0 !important;
        }

        .touch-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 200px;
            height: 200px;
            margin: 20px auto 0;
        }

        .touch-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            color: #fff;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }

        .touch-btn.up { grid-column: 2; grid-row: 1; }
        .touch-btn.down { grid-column: 2; grid-row: 3; }
        .touch-btn.left { grid-column: 1; grid-row: 2; }
        .touch-btn.right { grid-column: 3; grid-row: 2; }
        .touch-btn.center { 
            grid-column: 2; grid-row: 2;
            background: rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            
            .menu-container, .game-container {
                padding: 20px;
            }

            .mode-btn {
                padding: 12px 20px;
                font-size: 0.95rem;
                width: 130px;
            }

            .level-btn, .skin-btn {
                width: 45px;
                height: 45px;
                font-size: 1rem;
            }

            canvas {
                width: 100%;
                max-width: 100%;
                height: auto;
            }

            .game-btn {
                padding: 10px 15px;
                font-size: 0.85rem;
                margin: 5px;
            }

            .touch-controls {
                display: grid;
            }

            .instructions {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="name-input" id="name-input">
        <div class="name-input-content">
            <h2>👋 欢迎!</h2>
            <p>请输入你的游戏名字</p>
            <input type="text" id="player-name-input" placeholder="输入名字..." maxlength="10">
            <button class="btn-primary" id="confirm-name-btn">开始游戏</button>
            <p class="name-hint">名字将显示在排行榜上</p>
        </div>
    </div>

    <div class="menu-container" id="menu-container">
        <h1>🐍 贪吃蛇</h1>
        
        <div class="menu-section">
            <h2>选择模式</h2>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="levels">关卡模式</button>
                <button class="mode-btn" data-mode="endless">无穷模式</button>
            </div>
        </div>

        <div class="menu-section">
            <h2>选择关卡</h2>
            <div class="level-selector" id="level-selector">
                <button class="level-btn active" data-level="1">1</button>
                <button class="level-btn" data-level="2">2</button>
                <button class="level-btn" data-level="3">3</button>
                <button class="level-btn" data-level="4">4</button>
                <button class="level-btn" data-level="5">5</button>
            </div>
        </div>

        <div class="menu-section">
            <h2>选择皮肤</h2>
            <div class="skin-selector" id="skin-selector">
                <button class="skin-btn green active" data-skin="green" title="绿色"></button>
                <button class="skin-btn blue" data-skin="blue" title="蓝色"></button>
                <button class="skin-btn red" data-skin="red" title="红色"></button>
                <button class="skin-btn purple" data-skin="purple" title="紫色"></button>
                <button class="skin-btn gold" data-skin="gold" title="金色"></button>
                <button class="skin-btn cyan" data-skin="cyan" title="青色"></button>
                <button class="skin-btn pink" data-skin="pink" title="粉色"></button>
                <button class="skin-btn rainbow" data-skin="rainbow" title="彩虹"></button>
            </div>
            <div class="skin-preview" id="skin-preview">
                <div class="preview-segment"></div>
                <div class="preview-segment"></div>
                <div class="preview-segment"></div>
                <div class="preview-segment"></div>
                <div class="preview-segment"></div>
            </div>
        </div>

        <button class="start-game-btn" id="menu-start-btn">开始游戏</button>
    </div>

    <div class="game-container" id="game-container" style="display: none;">
        <h1>🐍 贪吃蛇</h1>
        
        <div class="level-info" id="level-info">关卡 1 / 5</div>

        <div class="score-board">
            <div class="score-item">得分: <span id="score">0</span></div>
            <div class="score-item">最高分: <span id="high-score">0</span></div>
        </div>

        <canvas id="game-canvas" width="600" height="300"></canvas>

        <div class="touch-controls">
            <button class="touch-btn up">↑</button>
            <button class="touch-btn left">←</button>
            <button class="touch-btn center"></button>
            <button class="touch-btn right">→</button>
            <button class="touch-btn down">↓</button>
        </div>

        <div class="controls">
            <button class="game-btn" id="start-btn">开始游戏</button>
            <button class="game-btn" id="pause-btn">暂停</button>
            <button class="game-btn" id="leaderboard-btn">排行榜</button>
            <button class="game-btn" id="back-btn">返回菜单</button>
        </div>

        <div class="instructions">
            使用 ↑ ↓ ← → 方向键控制蛇的移动 | 空格键暂停
        </div>
    </div>

    <div class="game-over" id="game-over">
        <button class="close-btn" id="close-gameover">×</button>
        <h2>游戏结束!</h2>
        <p>最终得分: <span id="final-score">0</span></p>
        <div class="btn-group">
            <button class="btn-primary" id="restart-btn">再来一局</button>
            <button class="btn-secondary" id="back-menu-btn">返回菜单</button>
        </div>
    </div>

    <div class="level-complete" id="level-complete">
        <h2>🎉 关卡完成!</h2>
        <p>关卡得分: <span id="level-score">0</span></p>
        <div class="btn-group">
            <button class="btn-primary" id="next-level-btn">下一关</button>
            <button class="btn-secondary" id="back-menu-btn2">返回菜单</button>
        </div>
    </div>

    <div class="leaderboard" id="leaderboard">
        <button class="close-btn" id="close-leaderboard">×</button>
        <h2>🏆 排行榜</h2>
        <div class="leaderboard-table" id="leaderboard-content">
            <div class="leaderboard-row header">
                <div class="rank">排名</div>
                <div class="name">玩家</div>
                <div class="score">得分</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const finalScoreElement = document.getElementById('final-score');
        const levelScoreElement = document.getElementById('level-score');
        const levelInfoElement = document.getElementById('level-info');
        const gameOverElement = document.getElementById('game-over');
        const levelCompleteElement = document.getElementById('level-complete');
        const leaderboardElement = document.getElementById('leaderboard');
        const leaderboardContent = document.getElementById('leaderboard-content');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const leaderboardBtn = document.getElementById('leaderboard-btn');
        const backBtn = document.getElementById('back-btn');
        const restartBtn = document.getElementById('restart-btn');
        const backMenuBtn = document.getElementById('back-menu-btn');
        const backMenuBtn2 = document.getElementById('back-menu-btn2');
        const nextLevelBtn = document.getElementById('next-level-btn');
        const closeGameoverBtn = document.getElementById('close-gameover');
        const closeLeaderboardBtn = document.getElementById('close-leaderboard');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const levelBtns = document.querySelectorAll('.level-btn');
        const levelSelector = document.getElementById('level-selector');
        const skinBtns = document.querySelectorAll('.skin-btn');
        const skinSelector = document.getElementById('skin-selector');
        const skinPreview = document.getElementById('skin-preview');
        const menuStartBtn = document.getElementById('menu-start-btn');
        const menuContainer = document.getElementById('menu-container');
        const gameContainer = document.getElementById('game-container');

        const GRID_SIZE = 20;
        const GRID_COUNT = canvas.width / GRID_SIZE;

        let snake = [];
        let food = {};
        let obstacles = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let leaderboard = JSON.parse(localStorage.getItem('snakeLeaderboard')) || [];
        let gameLoop = null;
        let isPaused = false;
        let isGameOver = false;
        let currentMode = 'levels';
        let currentLevel = 1;
        let foodsEaten = 0;
        let requiredFoods = 10;
        let baseSpeed = 200;
        let currentSkin = 'green';
        let playerName = '';
        let stars = [];

        const skinColors = {
            green: { head: ['#86efac', '#22c55e'], body: ['#4ade80', '#16a34a'], shadow: '#4ade80' },
            blue: { head: ['#93c5fd', '#3b82f6'], body: ['#60a5fa', '#2563eb'], shadow: '#60a5fa' },
            red: { head: ['#fca5a5', '#ef4444'], body: ['#f87171', '#dc2626'], shadow: '#f87171' },
            purple: { head: ['#d8b4fe', '#8b5cf6'], body: ['#a78bfa', '#7c3aed'], shadow: '#a78bfa' },
            gold: { head: ['#fde68a', '#f59e0b'], body: ['#fbbf24', '#d97706'], shadow: '#fbbf24' },
            cyan: { head: ['#67e8f9', '#06b6d4'], body: ['#22d3ee', '#0891b2'], shadow: '#22d3ee' },
            pink: { head: ['#f9a8d4', '#ec4899'], body: ['#f472b6', '#db2777'], shadow: '#f472b6' },
            rainbow: { head: ['#ff6b6b', '#feca57'], body: ['#48dbfb', '#ff9ff3'], shadow: '#ff6b6b' }
        };

        highScoreElement.textContent = highScore;

        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.5 + 0.1,
                    opacity: Math.random() * 0.8 + 0.2
                });
            }
        }

        const levelConfigs = [
            { speed: 200, obstacles: 4, requiredFoods: 10 },
            { speed: 180, obstacles: 6, requiredFoods: 12 },
            { speed: 160, obstacles: 8, requiredFoods: 15 },
            { speed: 140, obstacles: 10, requiredFoods: 18 },
            { speed: 120, obstacles: 12, requiredFoods: 20 }
        ];

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            foodsEaten = 0;
            isPaused = false;
            isGameOver = false;
            scoreElement.textContent = score;
            gameOverElement.classList.remove('show');
            levelCompleteElement.classList.remove('show');
            pauseBtn.textContent = '暂停';

            if (currentMode === 'levels') {
                const config = levelConfigs[currentLevel - 1];
                baseSpeed = config.speed;
                requiredFoods = config.requiredFoods;
                generateObstacles(config.obstacles);
                levelInfoElement.textContent = `关卡 ${currentLevel} / 5 (需吃${requiredFoods}个食物)`;
            } else {
                baseSpeed = 200;
                requiredFoods = 9999;
                generateObstacles(4);
                levelInfoElement.textContent = '无穷模式';
            }

            initStars();
            spawnFood();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, baseSpeed);
        }

        function generateObstacles(count) {
            obstacles = [];
            for (let i = 0; i < count; i++) {
                let obstacle;
                let attempts = 0;
                do {
                    obstacle = {
                        x: Math.floor(Math.random() * (GRID_COUNT - 2)) + 1,
                        y: Math.floor(Math.random() * (GRID_COUNT - 2)) + 1
                    };
                    attempts++;
                } while (isObstacleCollision(obstacle) && attempts < 100);
                obstacles.push(obstacle);
            }
        }

        function isObstacleCollision(pos) {
            for (let segment of snake) {
                if (segment.x === pos.x && segment.y === pos.y) return true;
            }
            for (let obs of obstacles) {
                if (obs.x === pos.x && obs.y === pos.y) return true;
            }
            return false;
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * GRID_COUNT),
                y: Math.floor(Math.random() * GRID_COUNT)
            };
            if (isObstacleCollision(food) || (food.x === snake[0].x && food.y === snake[0].y)) {
                spawnFood();
            }
        }

        function updateGame() {
            if (isPaused || isGameOver) return;

            direction = { ...nextDirection };

            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            if (head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT) {
                gameOver();
                return;
            }

            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            for (let obs of obstacles) {
                if (head.x === obs.x && head.y === obs.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                foodsEaten++;
                scoreElement.textContent = score;
                spawnFood();

                if (currentMode === 'levels' && foodsEaten >= requiredFoods) {
                    levelComplete();
                    return;
                }

                if (currentMode === 'endless' && foodsEaten % 5 === 0) {
                    baseSpeed = Math.max(80, baseSpeed - 5);
                    clearInterval(gameLoop);
                    gameLoop = setInterval(updateGame, baseSpeed);
                }
            } else {
                snake.pop();
            }

            drawGame();
        }

        function drawGame() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0f0c29');
            gradient.addColorStop(0.5, '#302b63');
            gradient.addColorStop(1, '#24243e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
                
                const twinkle = Math.sin(Date.now() / 1000 + star.x) * 0.3 + 0.7;
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity * twinkle})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.strokeStyle = 'rgba(100, 200, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            const glowSize = 50;
            const glowGradient = ctx.createRadialGradient(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                0,
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                glowSize
            );
            glowGradient.addColorStop(0, 'rgba(239, 68, 68, 0.3)');
            glowGradient.addColorStop(0.5, 'rgba(239, 68, 68, 0.1)');
            glowGradient.addColorStop(1, 'rgba(239, 68, 68, 0)');
            ctx.fillStyle = glowGradient;
            ctx.fillRect(
                food.x * GRID_SIZE + GRID_SIZE / 2 - glowSize,
                food.y * GRID_SIZE + GRID_SIZE / 2 - glowSize,
                glowSize * 2,
                glowSize * 2
            );

            ctx.fillStyle = '#6b7280';
            ctx.shadowColor = '#6b7280';
            ctx.shadowBlur = 5;
            for (let obs of obstacles) {
                ctx.fillRect(obs.x * GRID_SIZE + 1, obs.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            }
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ef4444';
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            const skin = skinColors[currentSkin];
            ctx.shadowColor = skin.shadow;
            ctx.shadowBlur = 15;
            
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                const gradient = ctx.createRadialGradient(
                    segment.x * GRID_SIZE + GRID_SIZE / 2,
                    segment.y * GRID_SIZE + GRID_SIZE / 2,
                    0,
                    segment.x * GRID_SIZE + GRID_SIZE / 2,
                    segment.y * GRID_SIZE + GRID_SIZE / 2,
                    GRID_SIZE / 2
                );
                
                if (currentSkin === 'rainbow') {
                    const hue = (i * 30) % 360;
                    gradient.addColorStop(0, `hsl(${hue}, 80%, 70%)`);
                    gradient.addColorStop(1, `hsl(${hue}, 70%, 50%)`);
                } else if (i === 0) {
                    gradient.addColorStop(0, skin.head[0]);
                    gradient.addColorStop(1, skin.head[1]);
                } else {
                    gradient.addColorStop(0, skin.body[0]);
                    gradient.addColorStop(1, skin.body[1]);
                }
                
                ctx.fillStyle = gradient;
                ctx.fillRect(segment.x * GRID_SIZE + 2, segment.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);
            }
            ctx.shadowBlur = 0;

            if (isPaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('暂停', canvas.width / 2, canvas.height / 2);
            }
        }

        function gameOver() {
            isGameOver = true;
            clearInterval(gameLoop);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
            }
            addToLeaderboard(score);
            finalScoreElement.textContent = score;
            gameOverElement.classList.add('show');
        }

        function levelComplete() {
            isGameOver = true;
            clearInterval(gameLoop);
            score += currentLevel * 50;
            scoreElement.textContent = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
            }
            addToLeaderboard(score);
            levelScoreElement.textContent = score;
            levelCompleteElement.classList.add('show');
        }

        function addToLeaderboard(newScore) {
            const name = playerName || '玩家' + Math.floor(Math.random() * 1000);
            leaderboard.push({ name: name, score: newScore });
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 10);
            localStorage.setItem('snakeLeaderboard', JSON.stringify(leaderboard));
        }

        function showLeaderboard() {
            leaderboardContent.innerHTML = '<div class="leaderboard-row header"><div class="rank">排名</div><div class="name">玩家</div><div class="score">得分</div></div>';
            
            if (leaderboard.length === 0) {
                leaderboardContent.innerHTML += '<div class="leaderboard-row"><div class="rank" style="text-align:center; width:100%">暂无记录</div></div>';
            } else {
                leaderboard.forEach((entry, index) => {
                    const row = document.createElement('div');
                    row.className = `leaderboard-row${index < 3 ? ' top-three' : ''}`;
                    let rankIcon = index + 1;
                    if (index === 0) rankIcon = '🥇';
                    if (index === 1) rankIcon = '🥈';
                    if (index === 2) rankIcon = '🥉';
                    row.innerHTML = `
                        <div class="rank">${rankIcon}</div>
                        <div class="name">${entry.name}</div>
                        <div class="score">${entry.score}</div>
                    `;
                    leaderboardContent.appendChild(row);
                });
            }
            leaderboardElement.classList.add('show');
        }

        function handleKeyDown(e) {
            if (isGameOver) return;

            switch (e.key) {
                case 'ArrowUp':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
                case ' ':
                    if (!isGameOver) togglePause();
                    break;
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '继续' : '暂停';
        }

        function switchMode(mode) {
            currentMode = mode;
            modeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            
            if (mode === 'levels') {
                levelSelector.style.display = 'flex';
            } else {
                levelSelector.style.display = 'none';
            }
        }

        function selectLevel(level) {
            if (currentMode !== 'levels') return;
            currentLevel = parseInt(level);
            levelBtns.forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.level) === currentLevel);
            });
        }

        function selectSkin(skin) {
            currentSkin = skin;
            skinBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.skin === skin);
            });
            updateSkinPreview();
        }

        function updateSkinPreview() {
            const segments = skinPreview.querySelectorAll('.preview-segment');
            const skin = skinColors[currentSkin];
            
            segments.forEach((seg, index) => {
                if (currentSkin === 'rainbow') {
                    const hue = (index * 30) % 360;
                    seg.style.background = `linear-gradient(135deg, hsl(${hue}, 80%, 70%), hsl(${hue}, 70%, 50%))`;
                } else if (index === 0) {
                    seg.style.background = `linear-gradient(135deg, ${skin.head[0]}, ${skin.head[1]})`;
                } else {
                    seg.style.background = `linear-gradient(135deg, ${skin.body[0]}, ${skin.body[1]})`;
                }
            });
        }

        function enterGame() {
            menuContainer.style.display = 'none';
            gameContainer.style.display = 'block';
            initStars();
            spawnFood();
            drawGame();
        }

        function returnToMenu() {
            menuContainer.style.display = 'block';
            gameContainer.style.display = 'none';
            if (gameLoop) clearInterval(gameLoop);
            gameOverElement.classList.remove('show');
            levelCompleteElement.classList.remove('show');
        }

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => switchMode(btn.dataset.mode));
        });

        levelBtns.forEach(btn => {
            btn.addEventListener('click', () => selectLevel(btn.dataset.level));
        });

        skinBtns.forEach(btn => {
            btn.addEventListener('click', () => selectSkin(btn.dataset.skin));
        });

        menuStartBtn.addEventListener('click', enterGame);
        startBtn.addEventListener('click', initGame);
        pauseBtn.addEventListener('click', togglePause);
        leaderboardBtn.addEventListener('click', showLeaderboard);
        backBtn.addEventListener('click', returnToMenu);
        restartBtn.addEventListener('click', initGame);
        backMenuBtn.addEventListener('click', returnToMenu);
        backMenuBtn2.addEventListener('click', returnToMenu);
        closeGameoverBtn.addEventListener('click', () => {
            gameOverElement.classList.remove('show');
        });
        closeLeaderboardBtn.addEventListener('click', () => {
            leaderboardElement.classList.remove('show');
        });
        nextLevelBtn.addEventListener('click', () => {
            levelCompleteElement.classList.remove('show');
            if (currentLevel < 5) {
                currentLevel++;
                levelBtns.forEach(btn => {
                    btn.classList.toggle('active', parseInt(btn.dataset.level) === currentLevel);
                });
            }
            initGame();
        });
        document.addEventListener('keydown', handleKeyDown);

        const touchBtns = document.querySelectorAll('.touch-btn');
        touchBtns.forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleTouchDirection(btn.classList);
            });
            btn.addEventListener('click', () => {
                handleTouchDirection(btn.classList);
            });
        });

        function handleTouchDirection(classList) {
            if (isGameOver) return;
            
            if (classList.contains('up') && direction.y !== 1) {
                nextDirection = { x: 0, y: -1 };
            } else if (classList.contains('down') && direction.y !== -1) {
                nextDirection = { x: 0, y: 1 };
            } else if (classList.contains('left') && direction.x !== 1) {
                nextDirection = { x: -1, y: 0 };
            } else if (classList.contains('right') && direction.x !== -1) {
                nextDirection = { x: 1, y: 0 };
            }
        }

        const nameInputElement = document.getElementById('name-input');
        const playerNameInput = document.getElementById('player-name-input');
        const confirmNameBtn = document.getElementById('confirm-name-btn');

        function showNameInput() {
            nameInputElement.style.display = 'flex';
            playerNameInput.focus();
        }

        function setPlayerName() {
            const name = playerNameInput.value.trim();
            if (name) {
                playerName = name;
                localStorage.setItem('snakePlayerName', name);
            } else {
                playerName = '玩家' + Math.floor(Math.random() * 1000);
            }
            nameInputElement.style.display = 'none';
        }

        confirmNameBtn.addEventListener('click', setPlayerName);

        playerNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                setPlayerName();
            }
        });

        const savedName = localStorage.getItem('snakePlayerName');
        if (savedName) {
            playerName = savedName;
            playerNameInput.value = savedName;
            nameInputElement.style.display = 'none';
        } else {
            showNameInput();
        }

        updateSkinPreview();
    </script>
</body>
</html>
