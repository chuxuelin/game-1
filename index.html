<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .menu-container, .game-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(100, 255, 100, 0.5);
        }

        .menu-section {
            margin-bottom: 30px;
        }

        .menu-section h2 {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .mode-btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 150px;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #000;
            border-color: #4ade80;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
        }

        .mode-btn:hover {
            transform: translateY(-2px);
        }

        .level-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .level-btn {
            width: 50px;
            height: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .level-btn.active {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.4);
        }

        .level-btn.locked {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .level-btn:hover:not(.locked) {
            transform: scale(1.1);
        }

        .skin-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .skin-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .skin-btn.active {
            border-color: #fff;
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .skin-btn:hover {
            transform: scale(1.1);
        }

        .skin-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 25px;
            height: 25px;
            transform: translate(-50%, -50%);
            border-radius: 5px;
        }

        .skin-btn.green::before { background: linear-gradient(135deg, #86efac, #22c55e); }
        .skin-btn.blue::before { background: linear-gradient(135deg, #93c5fd, #3b82f6); }
        .skin-btn.red::before { background: linear-gradient(135deg, #fca5a5, #ef4444); }
        .skin-btn.purple::before { background: linear-gradient(135deg, #d8b4fe, #8b5cf6); }
        .skin-btn.gold::before { background: linear-gradient(135deg, #fde68a, #f59e0b); }
        .skin-btn.cyan::before { background: linear-gradient(135deg, #67e8f9, #06b6d4); }
        .skin-btn.pink::before { background: linear-gradient(135deg, #f9a8d4, #ec4899); }
        .skin-btn.orange::before { background: linear-gradient(135deg, #fdba74, #fb923c); }
        .skin-btn.teal::before { background: linear-gradient(135deg, #5eead4, #14b8a6); }
        .skin-btn.magenta::before { background: linear-gradient(135deg, #f472b6, #db2777); }
        .skin-btn.random-ball::before {
            background: linear-gradient(135deg, #f97316, #38bdf8, #f472b6, #a855f7);
            animation: rainbow 2.5s linear infinite;
        }
        .skin-btn.rainbow::before { 
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            animation: rainbow 2s linear infinite;
        }

        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .player-id-display {
            margin-bottom: 20px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .player-id-display:hover {
            color: #60a5fa;
        }

        .skin-preview {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .skin-warning {
            margin-top: 12px;
            color: #facc15;
            font-size: 0.95rem;
            line-height: 1.4;
            display: none;
        }

        .skin-warning.show {
            display: block;
        }

        .preview-segment {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }

        .start-game-btn {
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: #fff;
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 300px;
        }

        .start-game-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(167, 139, 250, 0.4);
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .score-item {
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .score-item span {
            color: #4ade80;
        }

        .level-info {
            text-align: center;
            color: #60a5fa;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(100, 255, 100, 0.2);
            background: #000;
            max-width: 100%;
            height: auto;
        }

        .controls {
            margin-top: 20px;
            text-align: center;
        }

        .game-btn {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 0 8px;
            transition: all 0.3s ease;
        }

        #start-btn {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #000;
        }

        #pause-btn {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
        }

        #leaderboard-btn {
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: #fff;
        }

        #back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .instructions {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            font-size: 0.85rem;
        }

        .game-over, .level-complete, .leaderboard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .game-over.show, .level-complete.show, .leaderboard.show {
            display: flex;
        }

        .game-over h2 {
            color: #ef4444;
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        .level-complete h2 {
            color: #4ade80;
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }

        .leaderboard h2 {
            color: #a78bfa;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
        }

        .game-over p, .level-complete p {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 25px;
        }

        #final-score, #level-score {
            color: #4ade80;
            font-size: 1.5rem;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: #fff;
            padding: 12px 40px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 40px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-2px);
        }

        .leaderboard-table {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .leaderboard-row {
            display: flex;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .leaderboard-row:last-child {
            border-bottom: none;
        }

        .leaderboard-row.header {
            background: rgba(167, 139, 250, 0.3);
            font-weight: bold;
        }

        .leaderboard-row.top-three:nth-child(2) { background: rgba(251, 191, 36, 0.2); }
        .leaderboard-row.top-three:nth-child(3) { background: rgba(192, 192, 192, 0.2); }
        .leaderboard-row.top-three:nth-child(4) { background: rgba(217, 119, 6, 0.2); }

        .rank { width: 40px; color: #fff; }
        .name { flex: 1; color: #fff; }
        .score { width: 80px; color: #4ade80; text-align: right; }

        .empty-leaderboard {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .achievement-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            animation: fadeIn 0.3s ease;
        }

        .achievement-popup.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .achievement-content {
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.2), rgba(99, 102, 241, 0.2));
            border-radius: 25px;
            padding: 50px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 2px solid rgba(167, 139, 250, 0.5);
            box-shadow: 0 0 50px rgba(167, 139, 250, 0.3), 0 0 100px rgba(167, 139, 250, 0.1);
            animation: scaleIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .achievement-icon {
            font-size: 6rem;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .achievement-title {
            color: #fbbf24;
            font-size: 2rem;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }

        .achievement-message {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .achievement-score {
            color: #4ade80;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .achievement-stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .achievement-star {
            position: absolute;
            font-size: 2rem;
            animation: starFall 2s ease-out forwards;
            opacity: 0;
        }

        @keyframes starFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .achievement-btn {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(251, 191, 36, 0.4);
        }

        .achievement-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(251, 191, 36, 0.6);
        }

        .name-input {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .name-input-content {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .name-input h2 {
            color: #4ade80;
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }

        .name-input p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        #player-name-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.2rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        #player-name-input:focus {
            border-color: #4ade80;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
        }

        #player-name-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .name-hint {
            font-size: 0.85rem !important;
            color: rgba(255, 255, 255, 0.5) !important;
            margin-top: 15px !important;
            margin-bottom: 0 !important;
        }

        .touch-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 200px;
            height: 200px;
            margin: 20px auto 0;
            touch-action: none;
        }

        .control-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 15px;
            font-size: 0.95rem;
            text-align: center;
        }

        .control-legend span {
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .touch-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            color: #fff;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }

        .touch-btn.up { grid-column: 2; grid-row: 1; }
        .touch-btn.down { grid-column: 2; grid-row: 3; }
        .touch-btn.left { grid-column: 1; grid-row: 2; }
        .touch-btn.right { grid-column: 3; grid-row: 2; }
        .touch-btn.center { 
            grid-column: 2; grid-row: 2;
            background: rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            
            .menu-container, .game-container {
                padding: 20px;
            }

            .mode-btn {
                padding: 12px 20px;
                font-size: 0.95rem;
                width: 130px;
            }

            .level-btn, .skin-btn {
                width: 45px;
                height: 45px;
                font-size: 1rem;
            }

            canvas {
                width: 100%;
                max-width: 100%;
                height: auto;
            }

            .game-btn {
                padding: 10px 15px;
                font-size: 0.85rem;
                margin: 5px;
            }

            .touch-controls {
                display: grid;
            }

            .instructions {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="name-input" id="name-input">
        <div class="name-input-content">
            <h2>👋 欢迎!</h2>
            <p>请输入你的游戏名字</p>
            <input type="text" id="player-name-input" placeholder="输入名字..." maxlength="10">
            <button class="btn-primary" id="confirm-name-btn">开始游戏</button>
            <p class="name-hint">名字将显示在排行榜上</p>
        </div>
    </div>

    <div class="menu-container" id="menu-container">
        <h1>🐍 贪吃蛇</h1>
        
        <div class="menu-section">
            <h2>选择模式</h2>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="levels">关卡模式</button>
                <button class="mode-btn" data-mode="endless">无穷模式</button>
            </div>
        </div>

        <div class="menu-section">
            <h2>选择关卡</h2>
            <div class="level-selector" id="level-selector">
                <button class="level-btn active" data-level="1">1</button>
                <button class="level-btn" data-level="2">2</button>
                <button class="level-btn" data-level="3">3</button>
                <button class="level-btn" data-level="4">4</button>
                <button class="level-btn" data-level="5">5</button>
            </div>
        </div>

        <div class="menu-section">
            <div class="player-id-display" id="player-id-display">当前玩家：<span id="player-id">玩家</span></div>
            <h2>选择皮肤</h2>
            <div class="skin-selector" id="skin-selector">
                <button class="skin-btn green active" data-skin="green" title="绿色"></button>
                <button class="skin-btn blue" data-skin="blue" title="蓝色"></button>
                <button class="skin-btn red" data-skin="red" title="红色"></button>
                <button class="skin-btn purple" data-skin="purple" title="紫色"></button>
                <button class="skin-btn gold" data-skin="gold" title="金色"></button>
                <button class="skin-btn cyan" data-skin="cyan" title="青色"></button>
                <button class="skin-btn pink" data-skin="pink" title="粉色"></button>
                <button class="skin-btn orange" data-skin="orange" title="橙色"></button>
                <button class="skin-btn teal" data-skin="teal" title="青绿"></button>
                <button class="skin-btn magenta" data-skin="magenta" title="品红"></button>
                <button class="skin-btn random-ball" data-skin="random-ball" title="随机小球"></button>
                <button class="skin-btn rainbow" data-skin="rainbow" title="彩虹"></button>
            </div>
            <div class="skin-preview" id="skin-preview">
                <div class="preview-segment"></div>
                <div class="preview-segment"></div>
                <div class="preview-segment"></div>
                <div class="preview-segment"></div>
                <div class="preview-segment"></div>
            </div>
            <p class="skin-warning" id="skin-warning">随机小球皮肤：食物颜色会随机变化，吃掉后小蛇整体变色。</p>
        </div>

        <button class="start-game-btn" id="menu-start-btn">开始游戏</button>
    </div>

    <div class="game-container" id="game-container" style="display: none;">
        <h1>🐍 贪吃蛇</h1>
        
        <div class="level-info" id="level-info">关卡 1 / 5</div>

        <div class="score-board">
            <div class="score-item">得分: <span id="score">0</span></div>
            <div class="score-item">最高分: <span id="high-score">0</span></div>
        </div>

        <canvas id="game-canvas" width="600" height="300"></canvas>

        <div class="touch-controls">
            <button class="touch-btn up">↑</button>
            <button class="touch-btn left">←</button>
            <button class="touch-btn center"></button>

    <div class="leaderboard" id="leaderboard">

        <h2>🏆 排行榜</h2>
        <div class="leaderboard-table" id="leaderboard-content">

    <div class="achievement-popup" id="achievement-popup">
        <div class="achievement-stars" id="achievement-stars"></div>
        <div class="achievement-content">
            <div class="achievement-icon" id="achievement-icon">🎊</div>
            <div class="achievement-title" id="achievement-title">成就达成!</div>
            <div class="achievement-message" id="achievement-message">恭喜你创造了新纪录!</div>
            <div class="achievement-score" id="achievement-score">得分: 0</div>
            <button class="achievement-btn" id="achievement-btn">太棒了!</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.30.0/dist/umd/supabase.min.js"></script>
    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const finalScoreElement = document.getElementById('final-score');
        const levelScoreElement = document.getElementById('level-score');
        const levelInfoElement = document.getElementById('level-info');
        const gameOverElement = document.getElementById('game-over');
        const levelCompleteElement = document.getElementById('level-complete');
        const leaderboardElement = document.getElementById('leaderboard');
        const leaderboardContent = document.getElementById('leaderboard-content');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const leaderboardBtn = document.getElementById('leaderboard-btn');
        const backBtn = document.getElementById('back-btn');
        const restartBtn = document.getElementById('restart-btn');
        const backMenuBtn = document.getElementById('back-menu-btn');
        const backMenuBtn2 = document.getElementById('back-menu-btn2');
        const nextLevelBtn = document.getElementById('next-level-btn');
        const closeGameoverBtn = document.getElementById('close-gameover');
        const closeLeaderboardBtn = document.getElementById('close-leaderboard');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const levelBtns = document.querySelectorAll('.level-btn');
        const levelSelector = document.getElementById('level-selector');
        const skinBtns = document.querySelectorAll('.skin-btn');
        const skinSelector = document.getElementById('skin-selector');
        const skinPreview = document.getElementById('skin-preview');
        const menuStartBtn = document.getElementById('menu-start-btn');
        const menuContainer = document.getElementById('menu-container');
        const gameContainer = document.getElementById('game-container');
        const playerIdElement = document.getElementById('player-id');
        const playerIdDisplay = document.getElementById('player-id-display');
        const skinWarning = document.getElementById('skin-warning');
        const achievementPopup = document.getElementById('achievement-popup');
        const achievementIcon = document.getElementById('achievement-icon');
        const achievementTitle = document.getElementById('achievement-title');
        const achievementMessage = document.getElementById('achievement-message');
        const achievementScore = document.getElementById('achievement-score');
        const achievementBtn = document.getElementById('achievement-btn');
        const achievementStars = document.getElementById('achievement-stars');

        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const GRID_SIZE = 20;
        const GRID_COLS = canvas.width / GRID_SIZE;
        const GRID_ROWS = canvas.height / GRID_SIZE;

        let snake = [];
        let food = {};
        let obstacles = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let leaderboard = [];
        let gameLoop = null;
        let isPaused = false;
        let isGameOver = false;
        let currentMode = 'levels';
        let currentLevel = 1;
        let foodsEaten = 0;
        let requiredFoods = 10;
        let baseSpeed = 200;
        let currentSkin = 'green';
        let snakeBallColor = null;
        let playerName = '';
        let stars = [];

        const skinColors = {
            green: { head: ['#86efac', '#22c55e'], body: ['#4ade80', '#16a34a'], shadow: '#4ade80' },
            blue: { head: ['#93c5fd', '#3b82f6'], body: ['#60a5fa', '#2563eb'], shadow: '#60a5fa' },
            red: { head: ['#fca5a5', '#ef4444'], body: ['#f87171', '#dc2626'], shadow: '#f87171' },
            purple: { head: ['#d8b4fe', '#8b5cf6'], body: ['#a78bfa', '#7c3aed'], shadow: '#a78bfa' },
            gold: { head: ['#fde68a', '#f59e0b'], body: ['#fbbf24', '#d97706'], shadow: '#fbbf24' },
            cyan: { head: ['#67e8f9', '#06b6d4'], body: ['#22d3ee', '#0891b2'], shadow: '#22d3ee' },
            pink: { head: ['#f9a8d4', '#ec4899'], body: ['#f472b6', '#db2777'], shadow: '#f472b6' },
            orange: { head: ['#fed7aa', '#fb923c'], body: ['#fdba74', '#f97316'], shadow: '#fb923c' },
            teal: { head: ['#5eead4', '#14b8a6'], body: ['#2dd4bf', '#0f766e'], shadow: '#14b8a6' },
            magenta: { head: ['#f472b6', '#db2777'], body: ['#f9a8d4', '#be185d'], shadow: '#db2777' },
            'random-ball': { head: ['#f97316', '#38bdf8'], body: ['#f472b6', '#a855f7'], shadow: '#f97316' },
            rainbow: { head: ['#ff6b6b', '#feca57'], body: ['#48dbfb', '#ff9ff3'], shadow: '#ff6b6b' }
        };

        highScoreElement.textContent = highScore;

        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.5 + 0.1,
                    opacity: Math.random() * 0.8 + 0.2
                });
            }
        }

        const levelConfigs = [
            { speed: 200, obstacles: 4, requiredFoods: 10 },
            { speed: 180, obstacles: 6, requiredFoods: 12 },
            { speed: 160, obstacles: 8, requiredFoods: 15 },
            { speed: 140, obstacles: 10, requiredFoods: 18 },
            { speed: 120, obstacles: 12, requiredFoods: 20 }
        ];

        async function loadLeaderboardFromSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('scores')
                    .select('name, score')
                    .order('score', { ascending: false })
                    .limit(10);

                if (error) throw error;
                leaderboard = data || [];
            } catch (error) {
                console.error('加载排行榜失败:', error);
                leaderboard = [];
            }
        }

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            snakeBallColor = null;
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            foodsEaten = 0;
            isPaused = false;
            isGameOver = false;
            scoreElement.textContent = score;
            gameOverElement.classList.remove('show');
            levelCompleteElement.classList.remove('show');
            pauseBtn.textContent = '暂停';

            if (currentMode === 'levels') {
                const config = levelConfigs[currentLevel - 1];
                baseSpeed = config.speed;
                requiredFoods = config.requiredFoods;
                generateObstacles(config.obstacles);
                levelInfoElement.textContent = `关卡 ${currentLevel} / 5 (需吃${requiredFoods}个食物)`;
            } else {
                baseSpeed = 200;
                requiredFoods = 9999;
                generateObstacles(4);
                levelInfoElement.textContent = '无穷模式';
            }

            initStars();
            spawnFood();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, baseSpeed);
        }

        async function initializeLeaderboard() {
            await loadLeaderboardFromSupabase();
        }

        function generateObstacles(count) {
            obstacles = [];
            const occupied = new Set(snake.map(seg => `${seg.x},${seg.y}`));
            const availableCells = [];

            for (let x = 0; x < GRID_COLS; x++) {
                for (let y = 0; y < GRID_ROWS; y++) {
                    const key = `${x},${y}`;
                    if (!occupied.has(key)) {
                        availableCells.push({ x, y });
                    }
                }
            }

            const maxObstacles = Math.min(count, availableCells.length);
            for (let i = 0; i < maxObstacles; i++) {
                const index = Math.floor(Math.random() * availableCells.length);
                const chosen = availableCells.splice(index, 1)[0];
                obstacles.push(chosen);
            }
        }

        function getRandomBallColor() {
            const ballColors = ['#f97316', '#38bdf8', '#f472b6', '#a855f7', '#16a34a', '#facc15', '#22c55e', '#ec4899'];
            return ballColors[Math.floor(Math.random() * ballColors.length)];
        }

        function shadeColor(color, percent) {
            const num = parseInt(color.slice(1), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, Math.max(0, (num >> 16) + amt));
            const G = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amt));
            const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
            return `#${(R << 16 | G << 8 | B).toString(16).padStart(6, '0')}`;
        }

        function spawnFood() {
            const occupied = new Set([
                ...snake.map(seg => `${seg.x},${seg.y}`),
                ...obstacles.map(obs => `${obs.x},${obs.y}`)
            ]);
            const availableCells = [];

            for (let x = 0; x < GRID_COLS; x++) {
                for (let y = 0; y < GRID_ROWS; y++) {
                    const key = `${x},${y}`;
                    if (!occupied.has(key)) {
                        availableCells.push({ x, y });
                    }
                }
            }

            if (availableCells.length === 0) {
                food = { x: 0, y: 0, color: '#ef4444' };
                return;
            }

            const chosen = availableCells[Math.floor(Math.random() * availableCells.length)];
            food = {
                x: chosen.x,
                y: chosen.y,
                color: currentSkin === 'random-ball' ? getRandomBallColor() : '#ef4444'
            };
        }

        function hexToRGBA(hex, alpha) {
            const parsed = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            if (!parsed) return `rgba(255,255,255,${alpha})`;
            const r = parseInt(parsed[1], 16);
            const g = parseInt(parsed[2], 16);
            const b = parseInt(parsed[3], 16);
            return `rgba(${r},${g},${b},${alpha})`;
        }

        function updateGame() {
            if (isPaused || isGameOver) return;

            direction = { ...nextDirection };

            const head = {
                x: (snake[0].x + direction.x + GRID_COLS) % GRID_COLS,
                y: (snake[0].y + direction.y + GRID_ROWS) % GRID_ROWS
            };

            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            for (let obs of obstacles) {
                if (head.x === obs.x && head.y === obs.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                foodsEaten++;
                scoreElement.textContent = score;

                if (currentSkin === 'random-ball') {
                    snakeBallColor = food.color;
                }

                spawnFood();

                if (currentMode === 'levels' && foodsEaten >= requiredFoods) {
                    levelComplete();
                    return;
                }

                if (currentMode === 'endless' && foodsEaten % 5 === 0) {
                    baseSpeed = Math.max(80, baseSpeed - 5);
                    clearInterval(gameLoop);
                    gameLoop = setInterval(updateGame, baseSpeed);
                }
            } else {
                snake.pop();
            }

            drawGame();
        }

        function drawGame() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0f0c29');
            gradient.addColorStop(0.5, '#302b63');
            gradient.addColorStop(1, '#24243e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
                
                const twinkle = Math.sin(Date.now() / 1000 + star.x) * 0.3 + 0.7;
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity * twinkle})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.strokeStyle = 'rgba(100, 200, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= GRID_ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            const glowSize = 50;
            const ballColor = food.color || '#ef4444';
            const ballRGBA = hexToRGBA(ballColor, 0.35);
            const ballRGBAFaint = hexToRGBA(ballColor, 0.12);
            const glowGradient = ctx.createRadialGradient(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                0,
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                glowSize
            );
            glowGradient.addColorStop(0, ballRGBA);
            glowGradient.addColorStop(0.5, ballRGBAFaint);
            glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glowGradient;
            ctx.fillRect(
                food.x * GRID_SIZE + GRID_SIZE / 2 - glowSize,
                food.y * GRID_SIZE + GRID_SIZE / 2 - glowSize,
                glowSize * 2,
                glowSize * 2
            );

            ctx.fillStyle = '#6b7280';
            ctx.shadowColor = '#6b7280';
            ctx.shadowBlur = 5;
            for (let obs of obstacles) {
                ctx.fillRect(obs.x * GRID_SIZE + 1, obs.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            }
            ctx.shadowBlur = 0;

            ctx.fillStyle = food.color || '#ef4444';
            ctx.shadowColor = food.color || '#ef4444';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            const skin = skinColors[currentSkin];
            ctx.shadowColor = skin.shadow;
            ctx.shadowBlur = 15;
            
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                const gradient = ctx.createRadialGradient(
                    segment.x * GRID_SIZE + GRID_SIZE / 2,
                    segment.y * GRID_SIZE + GRID_SIZE / 2,
                    0,
                    segment.x * GRID_SIZE + GRID_SIZE / 2,
                    segment.y * GRID_SIZE + GRID_SIZE / 2,
                    GRID_SIZE / 2
                );
                
                if (currentSkin === 'rainbow') {
                    const hue = (i * 30) % 360;
                    gradient.addColorStop(0, `hsl(${hue}, 80%, 70%)`);
                    gradient.addColorStop(1, `hsl(${hue}, 70%, 50%)`);
                } else if (i === 0) {
                    const headColor = snakeBallColor || skin.head[0];
                    const headColor2 = snakeBallColor ? shadeColor(snakeBallColor, -15) : skin.head[1];
                    gradient.addColorStop(0, headColor);
                    gradient.addColorStop(1, headColor2);
                } else if (snakeBallColor) {
                    gradient.addColorStop(0, snakeBallColor);
                    gradient.addColorStop(1, shadeColor(snakeBallColor, -20));
                } else {
                    gradient.addColorStop(0, skin.body[0]);
                    gradient.addColorStop(1, skin.body[1]);
                }

                const segmentSize = i === snake.length - 1 ? GRID_SIZE - 8 : GRID_SIZE - 4;
                const offset = i === snake.length - 1 ? 4 : 2;
                const drawX = segment.x * GRID_SIZE + offset;
                const drawY = segment.y * GRID_SIZE + offset;

                ctx.fillStyle = gradient;
                ctx.fillRect(drawX, drawY, segmentSize, segmentSize);

                if (i === 0) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#111';
                    const eyeOffset = 6;
                    const eyeRadius = 2.5;
                    const headCenterX = segment.x * GRID_SIZE + GRID_SIZE / 2;
                    const headCenterY = segment.y * GRID_SIZE + GRID_SIZE / 2;
                    let eye1 = { x: headCenterX - eyeOffset, y: headCenterY - eyeOffset };
                    let eye2 = { x: headCenterX - eyeOffset, y: headCenterY + eyeOffset };

                    if (direction.x === 1) {
                        eye1 = { x: headCenterX + eyeOffset, y: headCenterY - eyeOffset };
                        eye2 = { x: headCenterX + eyeOffset, y: headCenterY + eyeOffset };
                    } else if (direction.x === -1) {
                        eye1 = { x: headCenterX - eyeOffset, y: headCenterY - eyeOffset };
                        eye2 = { x: headCenterX - eyeOffset, y: headCenterY + eyeOffset };
                    } else if (direction.y === -1) {
                        eye1 = { x: headCenterX - eyeOffset, y: headCenterY - eyeOffset };
                        eye2 = { x: headCenterX + eyeOffset, y: headCenterY - eyeOffset };
                    } else if (direction.y === 1) {
                        eye1 = { x: headCenterX - eyeOffset, y: headCenterY + eyeOffset };
                        eye2 = { x: headCenterX + eyeOffset, y: headCenterY + eyeOffset };
                    }

                    ctx.beginPath();
                    ctx.arc(eye1.x, eye1.y, eyeRadius, 0, Math.PI * 2);
                    ctx.arc(eye2.x, eye2.y, eyeRadius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 15;
                }
            }
            ctx.shadowBlur = 0;

            if (isPaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('暂停', canvas.width / 2, canvas.height / 2);
            }
        }

        async function gameOver() {
            isGameOver = true;
            clearInterval(gameLoop);
            const wasHighScore = score > highScore;
            if (wasHighScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
            }
            const rank = await addToLeaderboard(score);
            finalScoreElement.textContent = score;
            
            if (wasHighScore || rank <= 3) {
                showAchievement(wasHighScore, rank, score);
            } else {
                gameOverElement.classList.add('show');
            }
        }

        async function levelComplete() {
            isGameOver = true;
            clearInterval(gameLoop);
            score += currentLevel * 50;
            scoreElement.textContent = score;
            const wasHighScore = score > highScore;
            if (wasHighScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
            }
            const rank = await addToLeaderboard(score);
            levelScoreElement.textContent = score;
            
            if (wasHighScore || rank <= 3) {
                showAchievement(wasHighScore, rank, score);
            } else {
                levelCompleteElement.classList.add('show');
            }
        }

        async function addToLeaderboard(newScore) {
            const name = playerName || '玩家' + Math.floor(Math.random() * 1000);
            leaderboard.push({ name: name, score: newScore });
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 10);
            
            let rank = leaderboard.findIndex(entry => entry.score === newScore && entry.name === name) + 1;
            if (rank === 0) rank = leaderboard.length;

            try {
                const { error } = await supabaseClient
                    .from('scores')
                    .insert([{ name, score: newScore, created_at: new Date().toISOString() }]);
                if (error) throw error;
            } catch (error) {
                console.error('提交排行榜失败:', error);
            }
            
            return rank;
        }

        function createStarAnimation() {
            achievementStars.innerHTML = '';
            const starEmojis = ['⭐', '🌟', '✨', '💫', '🌟', '⭐'];
            for (let i = 0; i < 20; i++) {
                const star = document.createElement('div');
                star.className = 'achievement-star';
                star.textContent = starEmojis[Math.floor(Math.random() * starEmojis.length)];
                star.style.left = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.fontSize = (1 + Math.random()) + 'rem';
                achievementStars.appendChild(star);
            }
        }

        function showAchievement(isHighScore, rank, finalScore) {
            createStarAnimation();
            
            if (isHighScore && rank === 1) {
                achievementIcon.textContent = '🏆';
                achievementTitle.textContent = '新纪录!';
                achievementMessage.textContent = `恭喜你创造了新的最高分! 你现在是第一名!`;
            } else if (isHighScore) {
                achievementIcon.textContent = '🎉';
                achievementTitle.textContent = '新纪录!';
                achievementMessage.textContent = `恭喜你创造了新的最高分!`;
            } else if (rank === 1) {
                achievementIcon.textContent = '🥇';
                achievementTitle.textContent = '第一名!';
                achievementMessage.textContent = `恭喜你登上排行榜第一名! 太厉害了!`;
            } else if (rank === 2) {
                achievementIcon.textContent = '🥈';
                achievementTitle.textContent = '第二名!';
                achievementMessage.textContent = `恭喜你获得排行榜第二名! 继续加油!`;
            } else if (rank === 3) {
                achievementIcon.textContent = '🥉';
                achievementTitle.textContent = '第三名!';
                achievementMessage.textContent = `恭喜你获得排行榜第三名! 不错哦!`;
            }
            
            achievementScore.textContent = `得分: ${finalScore}`;
            achievementPopup.classList.add('show');
        }

        function closeAchievement() {
            achievementPopup.classList.remove('show');
            gameOverElement.classList.add('show');
        }

        achievementBtn.addEventListener('click', closeAchievement);

        async function showLeaderboard() {
            await loadLeaderboardFromSupabase();
            leaderboardContent.innerHTML = '<div class="leaderboard-row header"><div class="rank">排名</div><div class="name">玩家</div><div class="score">得分</div></div>';
            
            if (leaderboard.length === 0) {
                leaderboardContent.innerHTML += '<div class="leaderboard-row"><div class="rank" style="text-align:center; width:100%">暂无记录</div></div>';
            } else {
                leaderboard.forEach((entry, index) => {
                    const row = document.createElement('div');
                    row.className = `leaderboard-row${index < 3 ? ' top-three' : ''}`;
                    let rankIcon = index + 1;
                    if (index === 0) rankIcon = '🥇';
                    if (index === 1) rankIcon = '🥈';
                    if (index === 2) rankIcon = '🥉';
                    row.innerHTML = `
                        <div class="rank">${rankIcon}</div>
                        <div class="name">${entry.name}</div>
                        <div class="score">${entry.score}</div>
                    `;
                    leaderboardContent.appendChild(row);
                });
            }
            leaderboardElement.classList.add('show');
        }

        function handleKeyDown(e) {
            if (isGameOver) return;

            const key = e.key.toLowerCase();
            switch (key) {
                case 'arrowup':
                case 'w':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'arrowdown':
                case 's':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'arrowleft':
                case 'a':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'arrowright':
                case 'd':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
                case ' ':
                    if (!isGameOver) togglePause();
                    break;
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '继续' : '暂停';
        }

        function switchMode(mode) {
            currentMode = mode;
            modeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            
            if (mode === 'levels') {
                levelSelector.style.display = 'flex';
            } else {
                levelSelector.style.display = 'none';
            }
        }

        function selectLevel(level) {
            if (currentMode !== 'levels') return;
            currentLevel = parseInt(level);
            levelBtns.forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.level) === currentLevel);
            });
        }

        function selectSkin(skin) {
            currentSkin = skin;
            if (skin !== 'random-ball') {
                snakeBallColor = null;
            }
            skinBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.skin === skin);
            });
            skinWarning.classList.toggle('show', skin === 'random-ball');
            updateSkinPreview();
        }

        function updateSkinPreview() {
            const segments = skinPreview.querySelectorAll('.preview-segment');
            const skin = skinColors[currentSkin];
            
            segments.forEach((seg, index) => {
                if (currentSkin === 'rainbow') {
                    const hue = (index * 30) % 360;
                    seg.style.background = `linear-gradient(135deg, hsl(${hue}, 80%, 70%), hsl(${hue}, 70%, 50%))`;
                } else if (currentSkin === 'random-ball') {
                    const ballColor = getRandomBallColor();
                    seg.style.background = `radial-gradient(circle at center, ${ballColor} 0%, ${shadeColor(ballColor, -25)} 100%)`;
                } else if (index === 0) {
                    seg.style.background = `linear-gradient(135deg, ${skin.head[0]}, ${skin.head[1]})`;
                } else {
                    seg.style.background = `linear-gradient(135deg, ${skin.body[0]}, ${skin.body[1]})`;
                }
            });
        }

        function enterGame() {
            menuContainer.style.display = 'none';
            gameContainer.style.display = 'block';
            initStars();
            spawnFood();
            drawGame();
        }

        function returnToMenu() {
            menuContainer.style.display = 'block';
            gameContainer.style.display = 'none';
            if (gameLoop) clearInterval(gameLoop);
            gameOverElement.classList.remove('show');
            levelCompleteElement.classList.remove('show');
        }

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => switchMode(btn.dataset.mode));
        });

        levelBtns.forEach(btn => {
            btn.addEventListener('click', () => selectLevel(btn.dataset.level));
        });

        skinBtns.forEach(btn => {
            btn.addEventListener('click', () => selectSkin(btn.dataset.skin));
        });

        menuStartBtn.addEventListener('click', enterGame);
        startBtn.addEventListener('click', initGame);
        pauseBtn.addEventListener('click', togglePause);
        leaderboardBtn.addEventListener('click', showLeaderboard);
        backBtn.addEventListener('click', returnToMenu);
        restartBtn.addEventListener('click', initGame);
        backMenuBtn.addEventListener('click', returnToMenu);
        backMenuBtn2.addEventListener('click', returnToMenu);
        closeGameoverBtn.addEventListener('click', () => {
            gameOverElement.classList.remove('show');
        });
        closeLeaderboardBtn.addEventListener('click', () => {
            leaderboardElement.classList.remove('show');
        });
        nextLevelBtn.addEventListener('click', () => {
            levelCompleteElement.classList.remove('show');
            if (currentLevel < 5) {
                currentLevel++;
                levelBtns.forEach(btn => {
                    btn.classList.toggle('active', parseInt(btn.dataset.level) === currentLevel);
                });
            }
            initGame();
        });
        document.addEventListener('keydown', handleKeyDown);

        const touchBtns = document.querySelectorAll('.touch-btn');
        touchBtns.forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleTouchDirection(btn.classList);
            });
            btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                handleTouchDirection(btn.classList);
            });
            btn.addEventListener('click', () => {
                handleTouchDirection(btn.classList);
            });
        });

        function handleTouchDirection(classList) {
            if (isGameOver) return;
            
            if (classList.contains('up') && direction.y !== 1) {
                nextDirection = { x: 0, y: -1 };
            } else if (classList.contains('down') && direction.y !== -1) {
                nextDirection = { x: 0, y: 1 };
            } else if (classList.contains('left') && direction.x !== 1) {
                nextDirection = { x: -1, y: 0 };
            } else if (classList.contains('right') && direction.x !== -1) {
                nextDirection = { x: 1, y: 0 };
            }
        }

        const nameInputElement = document.getElementById('name-input');
        const playerNameInput = document.getElementById('player-name-input');
        const confirmNameBtn = document.getElementById('confirm-name-btn');

        function showNameInput() {
            nameInputElement.style.display = 'flex';
            playerNameInput.focus();
        }

        function setPlayerName() {
            const name = playerNameInput.value.trim();
            if (name) {
                playerName = name;
                localStorage.setItem('snakePlayerName', name);
            } else {
                playerName = '玩家' + Math.floor(Math.random() * 1000);
            }
            updatePlayerDisplay();
            nameInputElement.style.display = 'none';
        }

        confirmNameBtn.addEventListener('click', setPlayerName);

        playerNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                setPlayerName();
            }
        });

        function updatePlayerDisplay() {
            playerIdElement.textContent = playerName || '未命名玩家';
        }

        playerIdDisplay.addEventListener('click', showNameInput);

        const savedName = localStorage.getItem('snakePlayerName');
        if (savedName) {
            playerName = savedName;
            playerNameInput.value = savedName;
            nameInputElement.style.display = 'none';
        } else {
            showNameInput();
        }

        updatePlayerDisplay();
        updateSkinPreview();
        initializeLeaderboard();
    </script>
</body>
</html>
